name: Compilar APK de Al Día (tarjetas)

# Igual que el APK de Acierto: el runner de GitHub sí llega a los
# repositorios de Google (SDK de Android, plugin de Gradle), así que el
# APK se compila aquí y queda como artefacto descargable.
on:
  push:
    branches:
      - "**"
    paths:
      - "tarjetas-app/**"
      - ".github/workflows/build-tarjetas-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarjetas-app
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # Por defecto la acción pide el paquete "tools", que Google ya
          # retiró (sdkmanager falla con "Failed to find package 'tools'").
          # Gradle descarga solo la plataforma y build-tools que necesite.
          packages: "platform-tools"

      - name: Instalar dependencias de Capacitor
        run: npm ci

      - name: Pruebas del motor de cálculo
        run: npm test

      - name: Ensamblar la app (src/ -> www/)
        run: python3 build_www.py

      - name: Sincronizar el proyecto nativo
        run: npx cap sync android

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Fijar la versión del APK
        # run_number crece en cada ejecución: Android necesita un versionCode
        # creciente para reconocer que un APK es más nuevo que otro.
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar el APK de depuración
        working-directory: tarjetas-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: al-dia-tarjetas-apk
          path: tarjetas-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
